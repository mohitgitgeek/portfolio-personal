<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blog — Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
      .blog-wrap{max-width:900px;margin:36px auto;padding:20px;background:rgba(2,6,12,0.55);border-radius:10px}
      .blog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
      .blog-head a{color:var(--accent);text-decoration:none;font-weight:600}
      .editor{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:18px;margin:18px 0;display:flex;flex-direction:column;gap:10px}
      .editor input,.editor textarea{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#0b1220;color:#f7fbff;font-family:inherit;font-size:0.95rem}
      .editor textarea{min-height:160px;resize:vertical;line-height:1.5}
      .editor label{font-size:0.85rem;color:var(--muted);font-weight:600}
      .editor .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
      .editor button{background:#2ea043;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer}
      .editor button.cancel{background:rgba(255,255,255,0.08)}
      .editor button:hover{filter:brightness(1.1)}
      .hint{font-size:0.8rem;color:var(--muted)}
      .posts{display:flex;flex-direction:column;gap:16px;margin-top:8px}
      .post{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:18px}
      .post h2{margin:0 0 4px;color:#fff;font-size:1.25rem}
      .post .meta{color:var(--muted);font-size:0.8rem;margin-bottom:10px}
      .post .body{color:#dfe9f2;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
      .post .post-actions{margin-top:12px;display:flex;gap:8px}
      .post .post-actions button{background:rgba(255,255,255,0.08);color:#fff;border:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:0.82rem}
      .post .post-actions button.del{background:rgba(250,69,73,0.18);color:#fa9197}
      .empty{color:var(--muted);font-style:italic;padding:10px 0}
    </style>
  </head>
  <body>
    <main class="blog-wrap">
      <div class="blog-head">
        <h1>Blog</h1>
        <a href="index.html">← Back to portfolio</a>
      </div>

      <section class="editor">
        <strong id="editor-title-label">✍️ Write a new post</strong>
        <div>
          <label for="post-title">Title</label>
          <input id="post-title" type="text" placeholder="My awesome post title" autocomplete="off" />
        </div>
        <div>
          <label for="post-body">Body</label>
          <textarea id="post-body" placeholder="Write your post here... (line breaks are preserved)"></textarea>
        </div>
        <div class="row">
          <button id="save-post">Publish post</button>
          <button id="cancel-edit" class="cancel" style="display:none">Cancel edit</button>
          <span class="hint">Posts are saved in this browser (localStorage) — only you can see them on this device.</span>
        </div>
      </section>

      <section class="posts" id="posts"></section>
    </main>

    <script>
      const STORE_KEY = 'blog-posts';
      let editingId = null;

      function loadPosts() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
        catch (e) { return []; }
      }
      function savePosts(posts) {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(posts)); } catch (e) {}
      }
      function fmtDate(ts) {
        try { return new Date(ts).toLocaleString(); } catch (e) { return ''; }
      }
      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      const titleEl = document.getElementById('post-title');
      const bodyEl = document.getElementById('post-body');
      const saveBtn = document.getElementById('save-post');
      const cancelBtn = document.getElementById('cancel-edit');
      const editorLabel = document.getElementById('editor-title-label');
      const postsEl = document.getElementById('posts');

      function render() {
        const posts = loadPosts().sort(function (a, b) { return b.updated - a.updated; });
        postsEl.innerHTML = '';
        if (!posts.length) {
          postsEl.innerHTML = '<p class="empty">No posts yet — write your first one above!</p>';
          return;
        }
        posts.forEach(function (p) {
          const el = document.createElement('article');
          el.className = 'post';
          const edited = p.updated !== p.created ? ' · edited ' + fmtDate(p.updated) : '';
          el.innerHTML =
            '<h2>' + escapeHtml(p.title) + '</h2>' +
            '<div class="meta">' + fmtDate(p.created) + edited + '</div>' +
            '<div class="body">' + escapeHtml(p.body) + '</div>' +
            '<div class="post-actions">' +
              '<button data-edit="' + p.id + '">Edit</button>' +
              '<button class="del" data-del="' + p.id + '">Delete</button>' +
            '</div>';
          postsEl.appendChild(el);
        });
      }

      function resetEditor() {
        editingId = null;
        titleEl.value = '';
        bodyEl.value = '';
        saveBtn.textContent = 'Publish post';
        editorLabel.textContent = '✍️ Write a new post';
        cancelBtn.style.display = 'none';
      }

      saveBtn.addEventListener('click', function () {
        const title = titleEl.value.trim();
        const body = bodyEl.value.trim();
        if (!title || !body) { alert('Please add both a title and some body text.'); return; }
        const posts = loadPosts();
        const now = Date.now();
        if (editingId) {
          const p = posts.find(function (x) { return x.id === editingId; });
          if (p) { p.title = title; p.body = body; p.updated = now; }
        } else {
          posts.push({ id: 'p' + now + Math.floor(Math.random() * 1000), title: title, body: body, created: now, updated: now });
        }
        savePosts(posts);
        resetEditor();
        render();
      });

      cancelBtn.addEventListener('click', resetEditor);

      postsEl.addEventListener('click', function (e) {
        const editId = e.target.getAttribute('data-edit');
        const delId = e.target.getAttribute('data-del');
        if (editId) {
          const p = loadPosts().find(function (x) { return x.id === editId; });
          if (p) {
            editingId = p.id;
            titleEl.value = p.title;
            bodyEl.value = p.body;
            saveBtn.textContent = 'Update post';
            editorLabel.textContent = '✏️ Editing post';
            cancelBtn.style.display = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        } else if (delId) {
          if (confirm('Delete this post? This cannot be undone.')) {
            savePosts(loadPosts().filter(function (x) { return x.id !== delId; }));
            if (editingId === delId) resetEditor();
            render();
          }
        }
      });

      render();
    </script>
  </body>
</html>
